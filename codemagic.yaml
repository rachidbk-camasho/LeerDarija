workflows:
  ios-darija:
    name: Leer Darija iOS V3
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: ApiKeyRBK

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.leerdarija.app

      xcode: latest
      cocoapods: default
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create iOS project
        script: |
          npx cap add ios

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Check iOS project
        script: |
          echo "Contents of ios:"
          ls -la "$CM_BUILD_DIR/ios"

          echo "Contents of ios/App:"
          ls -la "$CM_BUILD_DIR/ios/App"

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/**/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
