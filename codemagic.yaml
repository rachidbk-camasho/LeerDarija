workflows:
  ios-darija:
    name: Leer Darija iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: ApiKeyRBK

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.leerdarija.app

      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create iOS project
        script: |
          npx cap add ios

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - ios/App/build/**/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true