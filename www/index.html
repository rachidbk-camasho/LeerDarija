<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8d1d2c"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Leer Darija</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717}.w{max-width:820px;margin:auto;padding:14px 14px 40px}.hero{background:#8d1d2c;color:white;border-radius:24px;padding:22px}.hero h1{margin:0;font-size:30px}.stats{display:flex;gap:8px;margin-top:14px}.stats span{background:#ffffff20;padding:9px 12px;border-radius:12px}.filters{display:flex;gap:8px;overflow:auto;margin:14px 0}.f,.back,.speak,.ans,.next,.open{min-height:44px;border-radius:12px;border:1px solid #e2ddd5;background:white;padding:9px 12px}.f.active,.open,.next{background:#8d1d2c;color:white;border-color:#8d1d2c}.lesson{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid #e2ddd5;border-radius:18px;padding:14px;margin-bottom:9px}.muted{color:#6b7280}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;gap:9px}@media(min-width:650px){.cards{grid-template-columns:1fr 1fr}}.card,.quiz{background:#fff;border:1px solid #e2ddd5;border-radius:18px;padding:15px}.ar{font-size:27px;font-weight:800;text-align:right;direction:rtl}.latin{font-weight:700;margin-top:7px}.speak{margin-top:9px}.quiz{margin-top:14px}.answers{display:grid;gap:8px;margin-top:10px}.ans{text-align:left}.ok{background:#dcfce7}.bad{background:#fee2e2}.next{width:100%;margin-top:10px}.daily{background:#fff;border:1px solid #e2ddd5;border-radius:18px;padding:15px;margin-top:12px}
</style></head><body><div class="w">
<section id="home" class="screen active"><div class="hero"><h1>Leer Darija 🇲🇦</h1><p>Nederlands → praktisch Marokkaans-Arabisch</p><div class="stats"><span><b id="lc"></b> lessen</span><span><b id="wc"></b> zinnen</span><span><b id="sc">0</b> punten</span></div></div><div class="daily"><b>🎯 Dagelijkse oefening</b><p class="muted">Train 10 willekeurige vragen.</p><button id="daily" class="next">Start 10 vragen</button></div><div class="filters"><button class="f active" data-l="all">Alles</button><button class="f" data-l="A1">A1</button><button class="f" data-l="A2">A2</button></div><div id="list"></div><p class="muted">Uitspraak: 3 = ع, 7 = ح, 9 = ق. De luisterknop gebruikt de Arabische stem van je telefoon indien beschikbaar.</p></section>
<section id="lesson" class="screen"><div class="top"><button id="back" class="back">← Lessen</button><b id="lev"></b></div><h2 id="title"></h2><div id="cards" class="cards"></div><div class="quiz"><b>Quiz</b><div id="qar" class="ar" style="margin-top:12px"></div><div id="qlat" class="latin"></div><div id="answers" class="answers"></div><div id="feedback" style="min-height:25px;margin-top:8px;font-weight:700"></div><button id="next" class="next">Volgende vraag</button></div></section>
</div><script src="lessons.js"></script><script>
(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let lvl="all",curL=null,cur=null,score=+(localStorage.darijaScore||0),daily=[],dailyMode=false;q("#lc").textContent=LESSONS.length;q("#wc").textContent=LESSONS.reduce((n,l)=>n+l.items.length,0);q("#sc").textContent=score;const sh=a=>[...a].sort(()=>Math.random()-.5);
function show(id){qa(".screen").forEach(x=>x.classList.remove("active"));q("#"+id).classList.add("active");scrollTo(0,0)}
function list(){q("#list").innerHTML="";LESSONS.filter(l=>lvl==="all"||l.level===lvl).forEach(l=>{let e=document.createElement("div");e.className="lesson";e.innerHTML=`<div><b>${l.emoji} ${l.title}</b><div class="muted">${l.level} · ${l.items.length} woorden/zinnen</div></div>`;let b=document.createElement("button");b.className="open";b.textContent="Open";b.onclick=()=>openL(l);e.appendChild(b);q("#list").appendChild(e)})}
function speak(t){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang="ar-MA";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function cards(l){q("#cards").innerHTML="";l.items.forEach(i=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<div class="ar">${i[0]}</div><div class="latin">${i[1]}</div><div class="muted">${i[2]}</div>`;let b=document.createElement("button");b.className="speak";b.textContent="🔊 Luister";b.onclick=()=>speak(i[0]);c.appendChild(b);q("#cards").appendChild(c)})}
function openL(l){dailyMode=false;curL=l;q("#title").textContent=l.emoji+" "+l.title;q("#lev").textContent=l.level;cards(l);question();show("lesson")}
function ask(item,pool){cur=item;q("#qar").textContent=item[0];q("#qlat").textContent=item[1];q("#feedback").textContent="";q("#answers").innerHTML="";let opts=sh([item,...sh(pool.filter(x=>x!==item&&x[2]!==item[2])).slice(0,3)]);opts.forEach(o=>{let b=document.createElement("button");b.className="ans";b.textContent=o[2];b.onclick=()=>{qa(".ans").forEach(x=>x.disabled=true);if(o===cur){b.classList.add("ok");q("#feedback").textContent="✅ Goed!";score++;localStorage.darijaScore=score;q("#sc").textContent=score}else{b.classList.add("bad");q("#feedback").textContent="❌ "+cur[2];qa(".ans").forEach(x=>{if(x.textContent===cur[2])x.classList.add("ok")})}};q("#answers").appendChild(b)})}
function question(){if(dailyMode){if(!daily.length){q("#qar").textContent="مبروك!";q("#qlat").textContent="mabrouk!";q("#answers").innerHTML="";q("#feedback").textContent="🎉 Dagelijkse oefening voltooid.";return}let i=daily.pop();ask(i,LESSONS.flatMap(l=>l.items));return}let p=curL.items;ask(p[Math.floor(Math.random()*p.length)],p)}
qa(".f").forEach(b=>b.onclick=()=>{qa(".f").forEach(x=>x.classList.remove("active"));b.classList.add("active");lvl=b.dataset.l;list()});q("#back").onclick=()=>{dailyMode=false;show("home")};q("#next").onclick=question;q("#daily").onclick=()=>{dailyMode=true;daily=sh(LESSONS.flatMap(l=>l.items)).slice(0,10);q("#title").textContent="🎯 Dagelijkse oefening";q("#lev").textContent="Mix";q("#cards").innerHTML="";question();show("lesson")};list();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")})();
</script></body></html>
